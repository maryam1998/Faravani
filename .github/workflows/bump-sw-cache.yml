name: Bump service worker cache version

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump CACHE_VERSION in sw.js
        run: |
          NEW_VERSION="${GITHUB_SHA::7}"
          sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = '${NEW_VERSION}';/" sw.js

      - name: Commit updated sw.js
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump service worker cache version [skip ci]"
          file_pattern: sw.js
